<!doctype html><html><head><meta charset="utf-8"><title>Noise Warden v2</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><h1>Noise Warden v2</h1><nav><a href="/">Dashboard</a> <a href="/timeline">Timeline</a> <a href="/thresholds">Thresholds</a> <a href="/config">Config</a> <a href="/calibration">Calibration</a></nav></header>
<main><section class="card"><h2>Live Status</h2><div id="status">Loading...</div><div class="buttons">
<button onclick="post('/api/control/arm')">Arm</button><button onclick="post('/api/control/disarm')">Disarm</button><button onclick="post('/api/control/kill')">Emergency Kill</button><button onclick="post('/api/control/kill/clear')">Clear Kill</button><button onclick="post('/api/control/test_playback')">Test Playback</button>
</div></section>
<section class="card"><h2>Incidents</h2><div class="buttons"><a class="button" href="/api/incidents/export.csv">Export CSV</a><button onclick="post('/api/incidents/clear').then(loadIncidents)">Clear All</button></div>
<table id="incidents"><thead><tr><th>ID</th><th>Started</th><th>Initial dB</th><th>Duration</th><th>Mode</th><th>Audio</th><th>Delete</th></tr></thead><tbody></tbody></table></section></main>
<script src="/static/app.js"></script></body></html>
