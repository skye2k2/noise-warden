{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Build</h2>
  {% if photo_path %}
    <img src="{{ photo_path }}" style="max-width:100%; border-radius:12px;">
  {% endif %}
  <form method="post" action="/build/upload" enctype="multipart/form-data">
    <p><input type="file" name="photo"></p>
    <p>Build Notes</p>
    <textarea name="notes">{{ meta.notes }}</textarea>
    <details>
      <summary>Measurement / Ordinance Reference</summary>
      <textarea name="ordinance_excerpt">{{ meta.ordinance_excerpt }}</textarea>
    </details>
    <p><input type="submit" value="Save Build"></p>
  </form>
</div>
{% endblock %}
