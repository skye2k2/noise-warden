<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Noise Warden</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; }
    nav { background: #222; color: #fff; padding: 12px; }
    nav a { color: #fff; margin-right: 14px; text-decoration: none; }
    .wrap { padding: 16px; max-width: 1200px; margin: auto; }
    .card { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #ddd; padding: 10px; vertical-align: top; }
    button, input[type=submit] { padding: 12px 16px; border-radius: 10px; border: 1px solid #888; cursor: pointer; }
    textarea { width: 100%; min-height: 180px; }
    .small { font-size: 12px; color: #555; }
    .pill { display: inline-block; padding: 6px 10px; border-radius: 999px; background: #eee; margin-right: 6px; }
    audio { width: 220px; }
  </style>
</head>
<body>
<nav>
  <a href="/">Dashboard</a>
  <a href="/incidents">Incidents</a>
  <a href="/timeline">Timeline</a>
  <a href="/build">Build</a>
  <a href="/config">Config</a>
  <a href="/calibration">Calibration</a>
</nav>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
