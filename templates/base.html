<!doctype html><html><head><meta charset="utf-8"><title>Noise Warden v2.2</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#111;color:#eee} nav{background:#1b1b1b;padding:12px;display:flex;gap:12px;flex-wrap:wrap}
nav a{color:#9ad;text-decoration:none}.wrap{padding:16px}.card{background:#1c1c1c;padding:16px;border-radius:8px;margin-bottom:16px}
table{width:100%;border-collapse:collapse} th,td{border-bottom:1px solid #333;padding:8px;text-align:left;vertical-align:top}
textarea{width:100%;min-height:220px;background:#0f0f0f;color:#eee;border:1px solid #444} input,button{padding:8px;margin:4px 0}
.timeline{border-left:2px solid #555;padding-left:16px}.incident-block{margin:8px 0;padding:8px;background:#202020;border-left:4px solid #4da3ff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px} img{max-width:100%;border-radius:8px}
</style>
<script>
const CACHE_KEY='noise_warden_cached_state_v2_2';
async function refreshState(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error('bad');const d=await r.json();localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),data:d}));const el=document.getElementById('live-state');if(el)el.innerText=JSON.stringify(d,null,2);}catch(e){const c=localStorage.getItem(CACHE_KEY);const el=document.getElementById('live-state');if(el){if(c){const p=JSON.parse(c);el.innerText='CURRENT STATE: UNKNOWN (showing cached)\n'+JSON.stringify(p.data,null,2);}else{el.innerText='CURRENT STATE: UNKNOWN';}}}}
setInterval(refreshState,5000);window.addEventListener('load',refreshState);
</script></head><body>
<nav><a href="/">Dashboard</a><a href="/incidents">Incidents</a><a href="/timeline">Timeline</a><a href="/thresholds">Thresholds</a><a href="/calibration">Calibration</a><a href="/build">Build</a><a href="/config">Config</a></nav>
<div class="wrap">{% block content %}{% endblock %}</div></body></html>
