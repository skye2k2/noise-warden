<!doctype html>
<html data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Noise Warden</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    /* Apply saved theme before first paint to avoid flash */
    (function () {
      var saved = localStorage.getItem('nw-theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body>
<nav>
  <a href="/">Dashboard</a>
  <a href="/timeline">Timeline</a>
  <a href="/incidents">Incidents</a>
  <a href="/thresholds">Thresholds</a>
  <a href="/build">Build</a>
  <a href="/config" class="online-only-link">Config</a>
  <a href="/calibration" class="online-only-link">Calibration</a>
  <span class="nav-version small" title="Release version (see CHANGELOG)">ver {{ app_version }}</span>
  <button id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">🌓</button>
</nav>
<div class="wrap">
{% block content %}{% endblock %}
</div>
<script>
function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  var next = (current === 'dark') ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('nw-theme', next);
}

/* Highlight the nav link matching the current page */
(function () {
  var path = location.pathname;
  document.querySelectorAll('nav a').forEach(function (a) {
    // Exact match, or root path matches "/"
    if (a.getAttribute('href') === path) {
      a.classList.add('active');
    }
  });
})();

/* Server-reachability detection and offline state management.
   ─────────────────────────────────────────────────────────────
   navigator.onLine is unreliable — it reflects network hardware state, not
   server reachability. On a LAN, the phone has WiFi so navigator.onLine is
   always true, even when the Pi's service is down. Instead, we detect server
   reachability by actually fetching /api/health and persist the state in
   sessionStorage so it survives SW-cached page navigations.

   Pages with their own pollers (dashboard.html) set window._nwPageHasPoller
   and call window._nwServerReachable(bool) directly, so the base heartbeat
   skips redundant fetches on those pages. */
(function () {
  var HEARTBEAT_INTERVAL = 10000;
  var STORAGE_KEY = 'nw-server-unreachable';

  function applyOfflineState(offline) {
    // Dim and disable Config/Calibration nav links
    document.querySelectorAll('.online-only-link').forEach(function (link) {
      if (offline) {
        link.classList.add('disabled-offline');
        // Save the href so we can restore it later, but only if not already saved
        if (link.getAttribute('href')) {
          link.setAttribute('data-href', link.getAttribute('href'));
          link.removeAttribute('href');
        }
        link.title = 'Unavailable while server is unreachable';
      } else {
        link.classList.remove('disabled-offline');
        var savedHref = link.getAttribute('data-href');
        if (savedHref) {
          link.setAttribute('href', savedHref);
          link.removeAttribute('data-href');
        }
        link.title = '';
      }
    });

    // Hide all destructive/mutation buttons and forms when server is down
    document.querySelectorAll('.destructive, form[method="post"]').forEach(function (el) {
      if (offline) {
        el.classList.add('hidden-offline');
      } else {
        el.classList.remove('hidden-offline');
      }
    });

    // Show/hide the offline indicator banner
    var indicator = document.getElementById('offline-indicator');
    if (indicator) {
      indicator.style.display = offline ? 'block' : 'none';
    }
  }

  // Global callback for page-specific pollers (dashboard.html pollState)
  window._nwServerReachable = function (reachable) {
    if (reachable) {
      sessionStorage.removeItem(STORAGE_KEY);
      applyOfflineState(false);
    } else {
      sessionStorage.setItem(STORAGE_KEY, '1');
      applyOfflineState(true);
    }
  };

  // Create the offline indicator bar
  var bar = document.createElement('div');
  bar.id = 'offline-indicator';
  bar.textContent = '⚡ Server unreachable — viewing cached data. Controls disabled.';
  bar.style.display = 'none';
  document.querySelector('.wrap').prepend(bar);

  // Restore persisted offline state immediately — before any fetch completes —
  // so the banner and disabled nav links are visible on cached page navigations.
  if (sessionStorage.getItem(STORAGE_KEY)) {
    applyOfflineState(true);
  }

  // Also honor the browser's built-in offline events as a fast path
  window.addEventListener('offline', function () { window._nwServerReachable(false); });
  window.addEventListener('online', function () {
    // Browser thinks we're online — verify with a real fetch before restoring
    fetch('/api/health').then(function (r) {
      if (r.ok) { window._nwServerReachable(true); }
    }).catch(function () { /* still unreachable */ });
  });

  // Start a lightweight heartbeat on pages that don't have their own poller.
  // Runs after a short delay to let page-specific pollers claim the flag first.
  setTimeout(function () {
    if (window._nwPageHasPoller) { return; }

    function heartbeat() {
      fetch('/api/health').then(function (r) {
        if (r.ok) {
          window._nwServerReachable(true);
        } else {
          window._nwServerReachable(false);
        }
      }).catch(function () {
        window._nwServerReachable(false);
      });
    }

    // Immediate check, then periodic
    heartbeat();
    setInterval(heartbeat, HEARTBEAT_INTERVAL);
  }, 500);
})();

/* Register the Service Worker globally so all pages benefit from caching.
   The SW intercepts /snippets/ fetches (caching them for offline use) and
   handles cached page responses.

   NOTE: Service Workers require a secure context (HTTPS or localhost). On the
   Pi, the install script generates a self-signed TLS certificate so the SW
   can register when accessed via https://<pi-ip>:8787/. Locally, the
   localhost exception means no cert is needed. */
(function () {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function () {
      // Registration failed — pages still function, just no offline support.
      // This is expected over plain HTTP to a non-localhost address.
    });
  }
})();
</script>
</body>
</html>
