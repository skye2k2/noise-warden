{% extends "base.html" %}
{% block content %}
<style>
  /* ---- Controls ---- */
  #tl-controls { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  #tl-controls button { padding:8px 14px; }
  #tl-controls button.active { background:var(--bg-nav); color:var(--text-nav); }
  #tl-view-label { font-weight:bold; margin:0 8px; min-width:160px; text-align:center; }
  #tl-status { margin-top:4px; }
  #tl-summary { font-size:18px; font-weight:bold; margin:8px 0 4px; }

  /* ---- Shared grid ---- */
  .tl-wrapper { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .tl-hours-col { width:48px; position:relative; flex-shrink:0; background:var(--bg-col-header); border-right:1px solid var(--border); }
  .tl-hour-label { position:absolute; left:4px; font-size:11px; color:var(--hour-label); transform:translateY(-7px); pointer-events:none; }
  .tl-columns { display:flex; flex:1; min-width:0; overflow-x:auto; }

  .tl-col { flex:1; position:relative; border-right:1px solid var(--hour-line); min-width:0; }
  .tl-col:last-child { border-right:none; }
  .tl-col-header { text-align:center; font-size:12px; padding:4px 2px; background:var(--bg-col-header); border-bottom:1px solid var(--border); white-space:nowrap; overflow:hidden; color:var(--text); cursor:pointer; }
  .tl-col-header:hover { text-decoration:underline; }
  .tl-col-header.today { font-weight:bold; color:var(--now-line); }
  .tl-col-body { position:relative; }

  .tl-hour-line { position:absolute; left:0; right:0; border-top:1px solid var(--hour-line); pointer-events:none; }
  .tl-now-line { position:absolute; left:0; right:0; border-top:2px solid var(--now-line); pointer-events:none; z-index:5; }

  /* ---- Incident blocks ---- */
  .tl-block { position:absolute; left:3px; right:3px; border-radius:5px; padding:2px 5px; color:#fff; font-size:11px; cursor:pointer; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.18); z-index:2; transition:opacity .12s; box-sizing:border-box; }
  .tl-block:hover { opacity:.82; }
  .tl-block-label { display:flex; align-items:center; justify-content:center; width:100%; height:100%; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Month compact pips (no padding — just colored position markers) */
  .tl-pip { position:absolute; left:2px; right:2px; border-radius:3px; cursor:pointer; min-height:5px; z-index:2; }
  .tl-pip:hover { opacity:.75; }

  /* ---- Borderline / zoom toggles ---- */
  #borderline-toggle { margin-left:12px; font-size:13px; }
  #zoom-toggle { margin-left:8px; font-size:13px; }
</style>

<div class="card">
  <h2>Timeline</h2>
  <div id="tl-controls">
    <button id="btn-day" onclick="switchView('day')">Day</button>
    <button id="btn-week" onclick="switchView('week')">Week</button>
    <button id="btn-month" onclick="switchView('month')">Month</button>
    <button onclick="navigate(-1)" title="Previous">&#8592;</button>
    <span id="tl-view-label"></span>
    <button onclick="navigate(1)" title="Next">&#8594;</button>
    <button onclick="goToday()">Today</button>
    <span id="tl-count" class="small" style="margin-left:8px"></span>
    <label id="borderline-toggle"><input type="checkbox" id="show-borderline" onchange="render(); saveTimelineState()"> Show borderline</label>
    <label id="zoom-toggle"><input type="checkbox" id="zoom-active" onchange="render(); saveTimelineState()"> Zoom to active hours</label>
  </div>
  <h3 id="tl-summary"></h3>
  <p class="small" id="tl-status"></p>
  <div id="tl-grid"></div>
</div>

{% include '_popup.html' %}

<script>
/* ======================================================================
   DATA — injected by server, cached by SW for offline use.
   All popup/detail views read from this array (zero extra DB calls).
   ====================================================================== */
var INCIDENTS = {{ incidents_json | safe }};
var ORDINANCE = {{ ordinance_json | safe }};

/* ======================================================================
   CONSTANTS
   ====================================================================== */
var CACHE_NAME = 'noise-warden-timeline-v1';
var HOUR_PX = 40;
var HDR_PX = 26;
var MIN_GRID_PX = 300;
var DAY_MS = 86400000;
var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* Configurable borderline margin — incidents within this many dB of the
   threshold are considered borderline and hidden by default. */
var BORDERLINE_MARGIN_DB = {{ borderline_margin_db }};

/* ======================================================================
   STATE
   Restored from localStorage so refreshes / tab-switches land where you
   left off instead of snapping back to today.
   ====================================================================== */
var STORAGE_KEY = 'nw-timeline-state';
var _restored = restoreTimelineState();
var currentView = _restored.view;
var currentDate = _restored.date;

/**
 * Read saved view + date from localStorage.
 * Falls back to server-provided view (or 'day') and today.
 */
function restoreTimelineState() {
  var fallbackView = '{{ view }}' || 'day';
  var fallbackDate = new Date();
  fallbackDate.setHours(0, 0, 0, 0);

  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { return { view: fallbackView, date: fallbackDate }; }

    var saved = JSON.parse(raw);
    var view = (['day', 'week', 'month'].indexOf(saved.view) !== -1) ? saved.view : fallbackView;
    var date = new Date(saved.date);

    // Guard against invalid or wildly out-of-range dates
    if (isNaN(date.getTime())) { return { view: view, date: fallbackDate }; }
    date.setHours(0, 0, 0, 0);
    if (view === 'month') { date.setDate(1); }

    // Restore checkbox states after DOM is ready
    document.addEventListener('DOMContentLoaded', function () {
      if (saved.showBorderline) {
        var borderEl = document.getElementById('show-borderline');
        if (borderEl) { borderEl.checked = true; }
      }
      if (saved.zoomActive) {
        var zoomEl = document.getElementById('zoom-active');
        if (zoomEl) { zoomEl.checked = true; }
      }
    });

    return { view: view, date: date };
  } catch (e) {
    return { view: fallbackView, date: fallbackDate };
  }
}

/** Persist current view + date + checkbox states so the next page load resumes. */
function saveTimelineState() {
  try {
    var borderEl = document.getElementById('show-borderline');
    var zoomEl = document.getElementById('zoom-active');
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      date: currentDate.toISOString(),
      showBorderline: borderEl ? borderEl.checked : false,
      view: currentView,
      zoomActive: zoomEl ? zoomEl.checked : false
    }));
  } catch (e) { /* storage full or disabled — non-critical */ }
}

/**
 * Scan visible incidents for the earliest and latest active hours across the
 * current view's date range. Returns { startHour, endHour } with ±1 hour
 * padding (clamped 0–24). Falls back to full range if nothing is visible.
 * @param {Date} rangeStart - First moment of the view
 * @param {Date} rangeEnd   - Last moment of the view
 */
function getActiveHourRange(rangeStart, rangeEnd) {
  var FULL_RANGE = { startHour: 0, endHour: 24 };
  var zoomEl = document.getElementById('zoom-active');
  if (!zoomEl || !zoomEl.checked) { return FULL_RANGE; }

  var minHour = 24;
  var maxHour = 0;
  var found = false;

  for (var i = 0; i < INCIDENTS.length; i++) {
    var inc = INCIDENTS[i];
    var start = new Date(inc.start_ts);
    var end = inc.end_ts ? new Date(inc.end_ts) : new Date(start.getTime() + 1000);

    // Skip incidents outside the visible date range entirely
    if (start >= rangeEnd || end <= rangeStart) { continue; }

    found = true;
    minHour = Math.min(minHour, start.getHours());
    // End hour: use the ceiling so a 10:45 end includes hour 10
    var endHour = end.getHours() + (end.getMinutes() > 0 || end.getSeconds() > 0 ? 1 : 0);
    maxHour = Math.max(maxHour, endHour);
  }

  if (!found) { return FULL_RANGE; }

  // ±1 hour padding, clamped to valid range
  return {
    startHour: Math.max(0, minHour - 1),
    endHour: Math.min(24, maxHour + 1)
  };
}

/**
 * Compute the grid pixel height and per-hour pixel size for the current view.
 * When zoom is active, fills available viewport space (minus controls, header,
 * status, and some breathing room). Enforces a minimum height for small screens.
 * @param {number} numHours - Number of hours in the visible range
 * @returns {Object} gridPx and hourPx for the current layout
 */
function computeGridLayout(numHours) {
  var zoomEl = document.getElementById('zoom-active');
  var isZoomed = zoomEl && zoomEl.checked;

  if (isZoomed) {
    // Measure available viewport space below the grid container
    var gridEl = document.getElementById('tl-grid');
    var rect = gridEl.getBoundingClientRect();
    // Available = viewport bottom minus grid top, minus a bit of bottom margin
    var available = window.innerHeight - rect.top - 16;
    var gridPx = Math.max(MIN_GRID_PX, available - HDR_PX);
    return { gridPx: gridPx, hourPx: gridPx / numHours };
  }

  // Default: fixed per-hour sizing
  return { gridPx: numHours * HOUR_PX, hourPx: HOUR_PX };
}

/* ======================================================================
   INIT
   ====================================================================== */
document.addEventListener('DOMContentLoaded', function () {
  render();
  /* Wait for SW to be active before precaching, otherwise on first visit
     the fetches bypass the SW and nothing actually lands in the cache. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(function () { precacheSnippets(); });
  }
  updateOnlineStatus();
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
});

/* ======================================================================
   NAVIGATION — all client-side, zero network calls
   ====================================================================== */
function switchView(view) {
  currentView = view;
  if (view === 'month') {
    currentDate.setDate(1);
  }
  render();
  saveTimelineState();
  history.replaceState(null, '', '/timeline?view=' + view);
}

function navigate(dir) {
  if (currentView === 'day') {
    currentDate.setDate(currentDate.getDate() + dir);
  } else if (currentView === 'week') {
    currentDate.setDate(currentDate.getDate() + (dir * 7));
  } else {
    currentDate.setMonth(currentDate.getMonth() + dir);
    currentDate.setDate(1);
  }
  /* Limit navigation to 1 month into the future */
  var futureLimit = new Date();
  futureLimit.setMonth(futureLimit.getMonth() + 1);
  futureLimit.setHours(23, 59, 59, 999);
  if (currentDate > futureLimit) {
    currentDate = new Date(futureLimit);
    currentDate.setHours(0, 0, 0, 0);
    if (currentView === 'month') { currentDate.setDate(1); }
  }
  render();
  saveTimelineState();
}

function goToday() {
  currentDate = new Date();
  currentDate.setHours(0, 0, 0, 0);
  if (currentView === 'month') {
    currentDate.setDate(1);
  }
  render();
  saveTimelineState();
}

/* ======================================================================
   RENDER DISPATCH
   ====================================================================== */
function render() {
  updateViewButtons();
  if (currentView === 'day') { renderDay(); }
  else if (currentView === 'week') { renderWeek(); }
  else { renderMonth(); }
}

function updateViewButtons() {
  document.getElementById('btn-day').className = (currentView === 'day') ? 'active' : '';
  document.getElementById('btn-week').className = (currentView === 'week') ? 'active' : '';
  document.getElementById('btn-month').className = (currentView === 'month') ? 'active' : '';
}

/* ======================================================================
   DAY VIEW — single tall column with full incident labels
   ====================================================================== */
function renderDay() {
  var dayStart = new Date(currentDate);
  dayStart.setHours(0, 0, 0, 0);
  setViewLabel(dayStart.toLocaleDateString([], { weekday:'long', month:'long', day:'numeric', year:'numeric' }));

  var dayEnd = new Date(dayStart.getTime() + DAY_MS);
  var range = getActiveHourRange(dayStart, dayEnd);
  var numHours = range.endHour - range.startHour;
  var layout = computeGridLayout(numHours);
  var gridPx = layout.gridPx;
  var hourPx = layout.hourPx;

  var gridEl = document.getElementById('tl-grid');
  gridEl.innerHTML = '';

  var wrapper = makeEl('div', 'tl-wrapper');
  wrapper.style.height = (gridPx + HDR_PX) + 'px';

  // Hour labels column
  wrapper.appendChild(buildHoursColumn(hourPx, gridPx, range.startHour, range.endHour));

  // Single day column
  var columns = makeEl('div', 'tl-columns');
  columns.appendChild(buildDayColumn(dayStart, hourPx, gridPx, true, range.startHour, range.endHour));
  wrapper.appendChild(columns);

  gridEl.appendChild(wrapper);
}

/* ======================================================================
   WEEK VIEW — 7 day columns with condensed labels
   ====================================================================== */
function renderWeek() {
  var monday = getMonday(currentDate);
  var sunday = new Date(monday);
  sunday.setDate(sunday.getDate() + 6);
  setViewLabel(formatDateShort(monday) + ' \u2013 ' + formatDateShort(sunday));

  var weekEnd = new Date(monday.getTime() + 7 * DAY_MS);
  var range = getActiveHourRange(monday, weekEnd);
  var numHours = range.endHour - range.startHour;
  var layout = computeGridLayout(numHours);
  var gridPx = layout.gridPx;
  var hourPx = layout.hourPx;

  var gridEl = document.getElementById('tl-grid');
  gridEl.innerHTML = '';

  var wrapper = makeEl('div', 'tl-wrapper');
  wrapper.style.height = (gridPx + HDR_PX) + 'px';

  wrapper.appendChild(buildHoursColumn(hourPx, gridPx, range.startHour, range.endHour));

  var columns = makeEl('div', 'tl-columns');
  for (var d = 0; d < 7; d++) {
    var dayStart = new Date(monday);
    dayStart.setDate(dayStart.getDate() + d);
    dayStart.setHours(0, 0, 0, 0);
    columns.appendChild(buildDayColumn(dayStart, hourPx, gridPx, false, range.startHour, range.endHour));
  }
  wrapper.appendChild(columns);

  gridEl.appendChild(wrapper);
}

/* ======================================================================
   MONTH VIEW — compact day columns with colored pips (no text labels)
   ====================================================================== */
function renderMonth() {
  var year = currentDate.getFullYear();
  var month = currentDate.getMonth();
  var numDays = new Date(year, month + 1, 0).getDate();
  setViewLabel(currentDate.toLocaleDateString([], { month:'long', year:'numeric' }));

  var monthStart = new Date(year, month, 1, 0, 0, 0, 0);
  var monthEnd = new Date(year, month + 1, 1, 0, 0, 0, 0);
  var range = getActiveHourRange(monthStart, monthEnd);
  var numHours = range.endHour - range.startHour;
  var layout = computeGridLayout(numHours);
  var gridPx = layout.gridPx;
  var hourPx = layout.hourPx;

  var gridEl = document.getElementById('tl-grid');
  gridEl.innerHTML = '';

  var wrapper = makeEl('div', 'tl-wrapper');
  wrapper.style.height = (gridPx + HDR_PX) + 'px';

  wrapper.appendChild(buildHoursColumn(hourPx, gridPx, range.startHour, range.endHour));

  var columns = makeEl('div', 'tl-columns');
  for (var d = 1; d <= numDays; d++) {
    var dayStart = new Date(year, month, d, 0, 0, 0, 0);
    var col = buildDayColumn(dayStart, hourPx, gridPx, false, range.startHour, range.endHour);
    // Override header to just the date number (saves horizontal space)
    col.querySelector('.tl-col-header').textContent = d;
    columns.appendChild(col);
  }
  wrapper.appendChild(columns);

  gridEl.appendChild(wrapper);
}

/* ======================================================================
   SHARED: hour-label column (left gutter)
   ====================================================================== */
function buildHoursColumn(hourPx, gridPx, startHour, endHour) {
  var col = makeEl('div', 'tl-hours-col');
  col.style.height = (gridPx + HDR_PX) + 'px';

  // Spacer matching the column header height
  var spacer = makeEl('div');
  spacer.style.height = HDR_PX + 'px';
  col.appendChild(spacer);

  for (var h = startHour; h < endHour; h++) {
    var lbl = makeEl('div', 'tl-hour-label');
    lbl.style.top = (HDR_PX + (h - startHour) * hourPx) + 'px';
    lbl.textContent = formatHour(h);
    col.appendChild(lbl);
  }
  return col;
}

/* ======================================================================
   SHARED: Build one day's column (header + hour lines + incidents + now line)
   ====================================================================== */
function buildDayColumn(dayStart, hourPx, gridPx, showLabels, startHour, endHour) {
  var dayEnd = new Date(dayStart.getTime() + DAY_MS);
  var today = new Date();
  // Visible time window within this day (for zoom clipping)
  var visibleStart = new Date(dayStart.getTime() + startHour * 3600000);
  var visibleEnd = new Date(dayStart.getTime() + endHour * 3600000);
  var numHours = endHour - startHour;

  var col = makeEl('div', 'tl-col');

  // Header (e.g. "Tue 8" or just "8" for month view — caller can override)
  // Clicking a column header in week/month view drills into that day.
  var hdr = makeEl('div', 'tl-col-header');
  var dow = (dayStart.getDay() + 6) % 7; // 0=Mon .. 6=Sun
  hdr.textContent = DAYS[dow] + ' ' + dayStart.getDate();
  hdr._dayDate = new Date(dayStart.getTime());
  hdr.addEventListener('click', function () {
    if (currentView === 'day') { return; }
    currentDate = new Date(this._dayDate.getTime());
    currentView = 'day';
    render();
    saveTimelineState();
    history.replaceState(null, '', '/timeline?view=day');
  });
  if (isSameDay(dayStart, today)) {
    hdr.className += ' today';
  }
  col.appendChild(hdr);

  // Body — all incident blocks and lines are absolutely positioned inside this
  var body = makeEl('div', 'tl-col-body');
  body.style.height = gridPx + 'px';

  // Hour lines (only within the visible hour range)
  for (var h = startHour + 1; h < endHour; h++) {
    var line = makeEl('div', 'tl-hour-line');
    line.style.top = ((h - startHour) * hourPx) + 'px';
    body.appendChild(line);
  }

  // Incidents overlapping this day
  var visibleCount = 0;
  var visibleDuration = 0;
  for (var i = 0; i < INCIDENTS.length; i++) {
    var inc = INCIDENTS[i];
    var start = new Date(inc.start_ts);
    // Defensive: if end_ts is missing, treat as a short blip at start time
    var end = inc.end_ts ? new Date(inc.end_ts) : new Date(start.getTime() + 1000);

    if (start >= dayEnd || end <= dayStart) { continue; }
    visibleCount++;
    visibleDuration += safeNum(inc.duration_sec, 0);

    // Clamp to the visible hour window (not just the calendar day)
    var clampStart = Math.max(start.getTime(), visibleStart.getTime());
    var clampEnd = Math.min(end.getTime(), visibleEnd.getTime());
    if (clampStart >= clampEnd) { continue; } // entirely outside zoomed range

    var topMin = (clampStart - visibleStart.getTime()) / 60000;
    var durMin = (clampEnd - clampStart) / 60000;

    var top = (topMin / 60) * hourPx;
    var minH = showLabels ? 18 : 5;
    var height = Math.max(minH, (durMin / 60) * hourPx);
    var excess = safeNum(inc.peak_db, inc.start_db) - safeNum(inc.threshold_db);

    /* Skip borderline incidents unless the toggle is checked */
    var showBorderline = document.getElementById('show-borderline') && document.getElementById('show-borderline').checked;
    var isBorderline = excess > 0 && excess <= BORDERLINE_MARGIN_DB;
    if (isBorderline && !showBorderline) { continue; }

    var block = makeEl('div', showLabels ? 'tl-block' : 'tl-pip');
    block.style.top = top + 'px';
    block.style.height = height + 'px';
    block.style.backgroundColor = severityColor(excess);

    // Build label: "classification (+X.YdB, duration)" — e.g. "mower (+12.3dB, 2m 15s)"
    var classLabel = (inc.classification || 'unknown').replace(/ \(multiple\)$/, '').replace(/\+$/, '');
    var blockLabel = classLabel + ' (+' + excess.toFixed(1) + 'dB, ' + formatDuration(inc.duration_sec) + ')';
    block.title = blockLabel;

    // Closure captures the correct incident reference per iteration
    block.onclick = (function (incident) {
      return function (e) { e.stopPropagation(); showPopup(incident); };
    })(inc);

    if (showLabels) {
      var label = makeEl('div', 'tl-block-label');
      label.textContent = blockLabel;
      block.appendChild(label);
    }

    body.appendChild(block);
  }

  // "Now" line — only if today is visible and current time falls within the zoomed range
  if (isSameDay(dayStart, today)) {
    var nowMin = today.getHours() * 60 + today.getMinutes();
    var rangeStartMin = startHour * 60;
    var rangeEndMin = endHour * 60;
    if (nowMin >= rangeStartMin && nowMin <= rangeEndMin) {
      var nowTop = ((nowMin - rangeStartMin) / 60) * hourPx;
      var nowLine = makeEl('div', 'tl-now-line');
      nowLine.style.top = nowTop + 'px';
      body.appendChild(nowLine);
    }
  }

  col.appendChild(body);

  // Accumulate incident count and duration for the status display
  accumulateCount(visibleCount, visibleDuration);

  return col;
}

/* ======================================================================
   SNIPPET CACHE STATUS
   ====================================================================== */
function checkSnippetCache(incidentId) {
  var statusEl = document.getElementById('snippet-status-' + incidentId);
  if (!statusEl || !('caches' in window)) { return; }

  caches.open(CACHE_NAME).then(function (cache) {
    return cache.match('/snippets/' + incidentId);
  }).then(function (match) {
    if (statusEl) {
      statusEl.textContent = match ? '\u2713 Available offline' : 'Streams when connected locally';
    }
  }).catch(function () {
    // Cache API unavailable — degrade gracefully
  });
}

/* ======================================================================
   UTILITIES
   ====================================================================== */

/** Create an element with an optional CSS class. */
function makeEl(tag, className) {
  var e = document.createElement(tag);
  if (className) { e.className = className; }
  return e;
}

/** Return the first non-null, non-NaN numeric argument, defaulting to 0. */
function safeNum() {
  for (var i = 0; i < arguments.length; i++) {
    if (arguments[i] != null && !isNaN(arguments[i])) { return Number(arguments[i]); }
  }
  return 0;
}

function formatHour(h) {
  if (h === 0) { return '12 AM'; }
  if (h < 12) { return h + ' AM'; }
  if (h === 12) { return '12 PM'; }
  return (h - 12) + ' PM';
}

function formatDuration(sec) {
  if (!sec || sec <= 0) { return '< 1s'; }
  if (sec < 60) { return Math.round(sec) + 's'; }
  var m = Math.floor(sec / 60);
  if (m < 60) { return m + 'm ' + Math.round(sec % 60) + 's'; }
  var hrs = Math.floor(m / 60);
  return hrs + 'h ' + (m % 60) + 'm';
}

function formatDateTime(d) {
  return d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric', year:'numeric' })
    + ' ' + d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
}

function formatDateShort(d) {
  return d.toLocaleDateString([], { month:'short', day:'numeric' });
}

function getMonday(d) {
  var date = new Date(d);
  var day = date.getDay();
  // Shift Sunday (0) back 6 days, everything else back to prior Monday
  var diff = date.getDate() - day + (day === 0 ? -6 : 1);
  date.setDate(diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear()
    && a.getMonth() === b.getMonth()
    && a.getDate() === b.getDate();
}

function severityColor(excessDb) {
  if (excessDb <= 0) { return 'var(--excess-borderline)'; }
  if (excessDb <= BORDERLINE_MARGIN_DB) { return 'var(--excess-borderline)'; }
  if (excessDb >= 40) { return '#c0392b'; }  // Deep red — extreme violation
  if (excessDb >= 30) { return '#e74c3c'; }  // Red — severe
  if (excessDb >= 25) { return '#e67e22'; }  // Orange — moderate
  if (excessDb >= 15) { return '#f39c12'; }  // Amber — notable
  return '#f1c40f';                           // Yellow — mild
}

function excessClass(excessDb) {
  if (excessDb <= 0) { return 'excess-borderline'; }
  if (excessDb <= BORDERLINE_MARGIN_DB) { return 'excess-borderline'; }
  if (excessDb >= 40) { return 'excess-severe'; }
  if (excessDb >= 30) { return 'excess-high'; }
  if (excessDb >= 25) { return 'excess-mid'; }
  if (excessDb >= 15) { return 'excess-low'; }
  return 'excess-low';
}

/** Determine day/night period from the start timestamp using ordinance hours. */
function inferPeriod(startTs) {
  var hour = new Date(startTs).getHours();
  var nightStart = (ORDINANCE.measurement && ORDINANCE.measurement.night_start) || 22;
  var dayStart = (ORDINANCE.measurement && ORDINANCE.measurement.day_start) || 7;
  if (hour >= nightStart || hour < dayStart) { return 'nighttime'; }
  return 'daytime';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function setViewLabel(text) {
  document.getElementById('tl-view-label').textContent = text;
}

/**
 * Accumulate visible incident count across columns before updating the UI.
 * Week/month views call buildDayColumn() multiple times per render — the
 * debounced timeout fires after all columns have rendered in the same frame.
 */
var _renderCount = 0;
var _renderDuration = 0;
var _countTimer = null;
function accumulateCount(count, durationSec) {
  _renderCount += count;
  _renderDuration += durationSec;
  clearTimeout(_countTimer);
  _countTimer = setTimeout(function () {
    var n = _renderCount;
    var dur = _renderDuration;
    _renderCount = 0;
    _renderDuration = 0;
    var countEl = document.getElementById('tl-count');
    var summaryEl = document.getElementById('tl-summary');
    if (n === 0) {
      summaryEl.textContent = 'No incidents in this period';
      countEl.textContent = '';
    } else {
      summaryEl.textContent = n + ' incident' + (n !== 1 ? 's' : '') +
        ' \u2014 ' + formatDuration(dur) + ' total';
      countEl.textContent = '';
    }
  }, 0);
}

/* ======================================================================
   ONLINE / OFFLINE STATUS
   ====================================================================== */
function updateOnlineStatus() {
  var statusEl = document.getElementById('tl-status');
  if (!navigator.onLine) {
    statusEl.textContent = '\u26A1 Offline mode \u2014 showing cached data';
    statusEl.style.color = '#e67e22';
  } else {
    statusEl.textContent = '';
    statusEl.style.color = '';
  }
}

/* ======================================================================
   SNIPPET PRE-CACHING
   SW registration is handled globally in base.html — no need to
   register here. The precache function relies on the SW being active
   to intercept and cache snippet fetches.
   ====================================================================== */

/**
 * Pre-cache audio snippets from the most recent 24 hours.
 * Each fetch() goes through the SW, which intercepts and caches the response.
 * Failures are silently swallowed (snippet won't be available offline, is all).
 */
function precacheSnippets() {
  var cutoff = Date.now() - (24 * 60 * 60 * 1000);
  var targets = [];

  for (var i = 0; i < INCIDENTS.length; i++) {
    var inc = INCIDENTS[i];
    if (inc.has_snippet && new Date(inc.start_ts).getTime() > cutoff) {
      targets.push(inc.id);
    }
  }
  if (targets.length === 0) { return; }

  var cached = 0;
  var statusEl = document.getElementById('tl-status');

  for (var j = 0; j < targets.length; j++) {
    fetch('/snippets/' + targets[j]).then(function () {
      cached++;
      if (cached === targets.length && navigator.onLine && statusEl) {
        statusEl.textContent = targets.length + ' recent snippet' + (targets.length !== 1 ? 's' : '') + ' cached for offline use';
      }
    }).catch(function () {
      // Network error for this snippet — skip
    });
  }
}
</script>
