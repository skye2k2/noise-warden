{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Timeline ({{ view }})</h2>
  <p>
    <a href="/timeline?view=day">Day</a> |
    <a href="/timeline?view=week">Week</a> |
    <a href="/timeline?view=month">Month</a>
  </p>
  <div>
    {% for r in rows %}
      <div class="card" style="margin-bottom:8px;">
        <b>#{{ r.id }}</b> {{ r.start_ts }}<br>
        Start dB: {{ r.start_db }} | Duration: {{ r.duration_sec or "active" }} sec
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
