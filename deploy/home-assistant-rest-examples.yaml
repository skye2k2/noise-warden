rest:
  - resource: "http://noise-warden.local:8787/api/status"
    scan_interval: 5
    sensor:
      - name: "Noise Warden dB Slow"
        value_template: "{{ value_json.current_db_slow }}"
      - name: "Noise Warden Classification"
        value_template: "{{ value_json.classification }}"
      - name: "Noise Warden Incident Active"
        value_template: "{{ value_json.incident_active }}"
      - name: "Noise Warden HA State"
        value_template: "{{ value_json.home_assistant_state }}"

rest_command:
  noise_warden_arm:
    url: "http://noise-warden.local:8787/api/control/arm"
    method: POST
  noise_warden_disarm:
    url: "http://noise-warden.local:8787/api/control/disarm"
    method: POST
  noise_warden_kill:
    url: "http://noise-warden.local:8787/api/control/kill"
    method: POST
  noise_warden_kill_clear:
    url: "http://noise-warden.local:8787/api/control/kill/clear"
    method: POST
