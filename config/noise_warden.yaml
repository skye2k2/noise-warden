app:
  base_dir: /opt/noise-warden
  shared_dir: /opt/noise-warden/shared
  static_dir: /opt/noise-warden/current/static
  host: 0.0.0.0
  port: 8787
  auth_token: ""  # optional bearer token; blank disables auth (LAN only)

audio:
  sample_rate: 22050                  # 22050 (wideband), 44100 (CD quality), or 48000 (studio). Lower = smaller WAVs. If your USB mic rejects this rate, the app falls back to the device default automatically.
  block_seconds: 1.0                  # Seconds per audio capture block. 1.0 is standard; smaller = more I/O overhead.
  input_device: null                  # null = default audio device.
  input_channels: 1
  # reference_device: null            # Secondary mic device for dual-mic reference subtraction (see plugins)
  recording_enabled: true
  chunk_flush_seconds: 30
  snippet_pre_seconds: 2              # Seconds of audio to prepend BEFORE the incident trigger. Written from a rolling buffer of recent blocks. Capped at 64 blocks (64s at block_seconds=1.0). Appears as a negative-timestamp "lead-in" journal entry. NOT counted toward incident duration.
  snippet_post_seconds: 3             # Seconds of sub-threshold audio to keep AFTER the last above-threshold block during tail trimming. Provides natural-sounding recording endings instead of hard cuts. Capped at song_gap_merge_sec (the maximum tail that can exist). NOT counted toward min_incident_seconds, but IS included in the stored incident duration.
  min_incident_seconds: 3             # Minimum active duration (time above threshold) before an incident is kept. Shorter incidents are auto-dismissed as "too_short" and quarantined. Neither snippet_pre_seconds (lead-in) nor snippet_post_seconds (tail padding) count toward this threshold--only the time the sound actually exceeded the detection threshold.
  max_incident_record_hours: 6        # Maximum hours to recording as a single incident, even if it keeps exceeding the threshold. Prevents runaway disk usage from a sustained noise source.
  snippet_normalize: true             # Normalize snippet peak amplitude after recording. USB mics produce -30 to -50 dBFS for loud sounds; normalizing to -6 dBFS makes recordings audible on consumer devices without cranking volume. DSP measurements use the raw signal and are unaffected.
  snippet_normalize_peak_dbfs: -6.0   # Target peak level for normalization (standard broadcast headroom). Only boosts, never attenuates — recordings already above the target are left alone.
  snippet_denoise: true               # Apply self-adaptive spectral denoising to remove ambient hiss ("seashore whoosh") from recorded snippets. Uses minimum-statistics noise estimation per snippet — no manual noise profile capture required. Runs AFTER DSP analysis (classification uses the raw signal) and BEFORE normalization (so gain boost amplifies clean audio, not amplified hiss). Safe to enable globally; very short snippets (< 46ms) are skipped automatically.
  denoise_percentile: 10              # Percentile for per-bin noise floor estimation (0–100). Lower = more conservative (removes less). The Nth percentile of each frequency bin's magnitude across all STFT frames is treated as stationary noise. 10 catches steady hiss while preserving transient events (speech, music, bangs). Raise to 15–20 for noisier environments; lower to 5 for minimal denoising.
  denoise_alpha: 1.0                  # Oversubtraction factor. 1.0 = subtract exactly the estimated noise floor. Values > 1.0 subtract more aggressively (cleaner but risks removing quiet signal content). Values < 1.0 subtract less (preserves more signal but leaves some hiss). Range 0.5–2.0 is practical; 1.0 is a safe default.
  denoise_beta: 0.04                  # Spectral floor as a fraction of original magnitude (0.0–1.0). Prevents complete zeroing of frequency bins, which causes "musical noise" — annoying tinkly/watery artifacts from phase-only reconstruction. 0.02 (2%) is conservative; raise to 0.05 if you hear artifacts. Lower values = cleaner but riskier.
  retention_days: 30                  # IF auto_purge_enabled, how many days to keep snippets and incidents before auto-deletion.
  auto_purge_enabled: false           # Set to true to automatically delete snippets and incidents older than retention_days.

detection:
  zone: residential_agricultural
  mode: continuous_music_focus        # continuous | intermittent | continuous_music_focus
  armed: true                         # Set to false by Pause button; persisted across watch-mode reloads
  # Borderline margin: incidents within this many dB above the threshold are tagged
  # as borderline and hidden by default on the timeline (still recorded for the full log).
  borderline_margin_db: 10.0          # -X dB overhead to allow for calibration imperfections and natural volume fluctuations. Set lower, like 5db, if you have a typically consistent environment.
  record_borderline_events: true      # When false, incidents whose peak dB is within borderline_margin_db of the threshold are auto-dismissed during finalization (classified as 'borderline', excluded, snippet quarantined to autodismissed/). Useful for noisy environments where marginal events clutter the log. When true (default), borderline incidents are recorded normally and only hidden in the timeline UI.
  noise_floor_db: 50.0                 # Ambient gate — signals below this dBA skip DSP analysis entirely.
  calibration_offset_db: 100          # Calibration offset to convert raw amplitude to dBA SPL. Calculated by recording a known sound source (e.g., 1 kHz tone at 94 dB SPL) and adjusting this offset until the measured dBA matches the known source level. This accounts for microphone sensitivity and gain settings.
  # Day/night thresholds use the Pi's system clock. Ensure `timedatectl set-timezone`
  # matches your local timezone.
  expected_timezone: America/Denver   # For startup validation only — not used for time math.
  night_start_hour: 22
  night_end_hour: 7
  # When in music-focused mode, we use a combination of calculations to determine music-like characteristics.
  # Still training.
  song_gap_merge_sec: 12
  min_music_like_score: 0.62
  min_beat_confidence: 0.20
  impulse_peak_delta_db: 14.0
  # Filter holdover: once a filter runs for holdover_min_run consecutive blocks,
  # it persists through up to holdover_max_gap unmatched blocks. Prevents mower
  # stop/restart gaps from fragmenting into unknown/impulse journal entries.
  holdover_min_run: 5                 # Minimum consecutive blocks to establish a filter
  holdover_max_gap: 12                # Maximum unmatched blocks before holdover expires
  holdover_priority_breakers: thunder # Comma-separated filters that can break active holdovers. Flyover can be added here to prevent wind from superseding flyover detections (e.g. "thunder, flyover").
  # Thunder targeting: two detection paths for very different storm signatures.
  # Path A (sharp cracks): single-block 18+ dB spike with dominant bass (lowband > 0.55)
  # and broadband energy (flatness > 0.45). Path B (sustained rumble): low centroid
  # (≤ 1300), extremely concentrated energy (flatness ≤ 0.15 — opposite of Path A),
  # dominant midband (≥ 0.40), loud (≥ 95 dBA), requires 6+ blocks of sustained pattern.
  # Checked second in filter priority (after impulse). Key separator from mower:
  # mower flatness is always ≥ 0.28, while thunder rumble is < 0.15.
  # Requires quality microphone — consumer mics lack the bass response for reliable detection.
  thunder_peak_delta_db: 18.0
  thunder_lowband_min: 0.55           # Path A: minimum lowband_ratio — thunder is bass-dominant
  thunder_flatness_min: 0.45           # Path A: minimum spectral flatness — thunder is broadband rumble
  # Thunder Path B: sustained rumble from mellow/distant storms. Very low
  # centroid, extremely concentrated energy (low flatness), dominant midband.
  thunder_rumble_centroid_max: 1500   # Max centroid Hz — rumble tail drifts up to ~1450 before dissipating
  thunder_rumble_flatness_max: 0.15    # Max flatness — thunder concentrates energy (opposite of Path A)
  thunder_rumble_midband_min: 0.40    # Min midband ratio — rumble body sits in 180–1200 Hz
  thunder_rumble_min_db: 40.0         # Min dBA — spectral criteria are the real guards; this just rejects silence
  thunder_rumble_min_history: 6       # Min blocks of history before Path B activates
  # Rain targeting: steady broadband noise with near-zero amplitude variation.
  # Real outdoor rain at 100+ dBA: flatness 0.27–0.38, env_std < 0.50,
  # lowband 0.08–0.14, centroid 3130–4023 Hz. Checked after birdsong, before
  # weedwhacker in filter priority. Key separator from mower: lowband_min —
  # rain excites bass evenly (0.08–0.14), while mowers have almost none (0.02–0.06).
  # Centroid ceiling prevents birdsong with incidental bass (from ambient fan/HVAC)
  # from being absorbed — rain centroid maxes at ~4023, birdsong false-positives start at 5800+.
  rain_flatness_threshold: 0.27        # Real rain measured 0.27–0.38
  rain_low_variance_db: 1.5           # Rain is extremely steady once established (env_std < 0.50)
  rain_lowband_min: 0.07              # Rain lowband 0.08–0.14; mower lowband 0.02–0.06
  rain_centroid_max_hz: 5000          # Rain centroid maxes at 4023; rejects high-freq birdsong
  # Rain music score guard: bass-heavy music through walls can mimic rain's flat,
  # steady spectral profile. Real rain mscore maxes at 0.593; bass music scores
  # 0.70+. Blocks scoring above this threshold are rejected by the rain filter.
  rain_max_music_score: 0.70
  # Wind targeting: broadband aero turbulence across the microphone. Even with
  # a deadcat windscreen, building features (roof edges, eaves, vents) cause
  # wind whistle that pushes centroid into the 3300–5800 Hz range. Wind is
  # spectrally similar to rain but separated by higher lowband (air pressure
  # fluctuations) and higher centroid (whistle from obstructions).
  # Checked after amplified_bass, before rain in filter priority.
  # Key separator from rain: lowband_min — wind ≥ 0.12 vs rain 0.08–0.14.
  # NOTE: thresholds calibrated from moderate wind with roof-edge whistle.
  # Stronger winds or different mic placement may need adjustment.
  wind_flatness_min: 0.30              # Broadband aero noise — real wind measured 0.32–0.55
  wind_centroid_min_hz: 2500          # Wind sits higher than mower/diesel — real wind 3313+
  wind_centroid_max_hz: 8000          # Wind whistle from roof edges — real wind up to 5858
  wind_lowband_min: 0.12              # Air pressure fluctuations — separates from rain (max 0.14)
  wind_lowband_max: 0.26              # Tight ceiling — real wind maxes at 0.255; plane lowband 0.28+ escapes
  wind_highband_min: 0.30             # mid-to-high energy — real wind 0.40–0.60
  wind_highband_max: 0.65             # ceiling — real wind maxes at 0.595; rejects birdsong (0.65+)
  wind_env_std_max: 4.0               # Wind is relatively steady once established (real: 0–2.5)
  wind_min_history: 6                 # Blocks before wind filter activates
  wind_max_music_score: 0.70          # Reject bass-heavy music that overlaps wind's flatness range
  # Birdsong targeting: four detection paths for different bird call patterns.
  # Path A (sustained): high highband + moderate flatness + low env_std.
  # Path B (bursty): extreme highband peak + high env_std + loud chirps.
  # Path C (spectral purity): ≥95% highband + high centroid.
  # Path D (chorus): temporal highband variance across a sliding window of
  # blocks. Multi-species choruses create significant block-to-block variation
  # in highband_ratio (std 0.05–0.16) while mowers are stable (std 0.03–0.09).
  # Window-wide lowband ceiling (0.12) rejects thunder, rain, diesel, and most
  # mower blocks which always have some high-lowband blocks in their window.
  # Real chorus: highband 0.34–0.95, lowband 0.01–0.13, centroid 1330–2885.
  # Targets the 2–8 kHz band typical of songbirds. Lowband raised from 0.10 to
  # 0.15 after continuous capture showed background fan/HVAC adds ~0.11 lowband.
  birdsong_highband_min: 0.70         # Path A: mower has 0.58–0.83; birds should be higher
  birdsong_lowband_max: 0.15          # Paths A/B/C: allow incidental white noise bass from surroundings (fan/HVAC hum, etc.)
  birdsong_flatness_min: 0.30          # Path A: bird chirps have sharp harmonics (0.09–0.43)
  birdsong_amplitude_std_max: 1.0     # Path A: sustained birdsong is very stable (multi-bird chorus peaks at 0.77)
  birdsong_min_history: 8             # Paths A/B/C: minimum db_history length before birdsong filter activates
  # Path D — multi-species chorus detection (temporal analysis)
  birdsong_chorus_highband_std_min: 0.10  # Min std dev of highband over window. Chorus: 0.05–0.16; mower-gas max: 0.106
  birdsong_chorus_lowband_max: 0.12       # Window-wide lowband ceiling. Chorus max: 0.133; mower-gas min window max: 0.123
  birdsong_chorus_min_history: 12         # Minimum feature history blocks before Path D activates
  # Amplified bass targeting: bass-heavy music through walls — the neighborhood
  # thump filter. When a neighbor runs amplified music with boosted bass through
  # a garage or exterior wall, the low-frequency energy dominates. The result is
  # a steady, bass-heavy signal with a remarkably high music-like score.
  # Through walls (~90 dB): lowband 0.36–0.61, centroid 1833–3301, flatness 0.18–0.33,
  # mscore 0.69–0.79 (all ≥ 0.60), bconf 0.04–0.86 (median 0.54).
  # Open windows (~90 dB): lowband 0.09–0.44, centroid 2131–4678, flatness 0.21–0.44,
  # mscore 0.40–0.73 (median 0.50), bconf 0.00–0.66 (truck overlay kills rhythm).
  # Checked after birdsong, before rain/mower in filter priority.
  # Safety: rain blocked by lowband (max 0.137 < 0.16), mower by lowband+mscore,
  # diesel blocked by flatness (median 0.151 < 0.20). Zero false positives on all clips.
  amplified_bass_min_music_score: 0.45 # Through-wall ≥ 0.60; open-window median 0.50. Captures both scenarios
  amplified_bass_lowband_min: 0.16     # Through-wall 0.36+; open-window median 0.19. Rain max 0.137 (margin 0.023)
  amplified_bass_centroid_max_hz: 4000 # Through-wall 1833–3301; open-window extends to 4678, bulk below 4000
  amplified_bass_env_std_max: 3.0      # Real bass music: 0.68–2.05. Steady thump is remarkably consistent
  amplified_bass_min_history: 6        # Minimum db_history length before filter activates
  amplified_bass_min_beat_confidence: 0.0   # Disabled — truck/wind overlays destroy rhythm. Flatness guards diesel instead
  amplified_bass_flatness_min: 0.20    # Diesel guard — diesel flatness median 0.151, bass music min 0.207
  # Mower targeting: sustained mid-frequency mechanical drone (300–4000 Hz centroid).
  # Real gas mower: flatness 0.28–0.48, centroid 800–3450+, highband ≤ 0.664,
  # lowband 0.02–0.06, env_std ~1.3–2.3, 75+ dBA. Checked after weedwhacker in
  # filter priority. Key separators: from birdsong — flatness floor (0.28 vs chorus
  # peak 0.27) and highband ceiling (0.75 vs chorus 0.80+); from rain — lowband
  # (mower 0.02–0.06 vs rain 0.08–0.14); from HVAC/fan — dB floor (70 dBA minimum).
  mower_flatness_threshold: 0.28       # Real gas mower measured 0.28–0.48; chorus birdsong peaks at 0.27
  mower_centroid_min_hz: 300
  mower_centroid_max_hz: 4000         # Real mower reached 3450 Hz; widened from 3000
  mower_env_std_max: 4.5              # Maximum dB std dev — allows for some variation
  mower_min_db: 70.0                  # Minimum dBA floor — rejects quiet fan/HVAC hum
  mower_highband_max: 0.75            # Real mowers peak at 0.664; birdsong choruses sit at 0.80+
  # Mower music score guard: bass music through walls can land in mower's centroid
  # + flatness range. Real mower mscore maxes at 0.548 (gas) / 0.637 (electric);
  # bass music scores 0.70+. Provides defense-in-depth alongside amplified_bass filter.
  mower_max_music_score: 0.70
  # Weedwhacker targeting: high-pitched mechanical whine (2–6 kHz).
  # Checked before mower since their centroid ranges can overlap at the boundary.
  weedwhacker_centroid_min_hz: 2000
  weedwhacker_centroid_max_hz: 6000
  weedwhacker_flatness_min: 0.50       # Raised from 0.45 — real mower flatness spikes to 0.46, avoid overlap
  weedwhacker_lowband_max: 0.15       # No significant bass
  weedwhacker_env_std_max: 5.0        # Operator movement adds some variance
  # Diesel engine targeting: sustained tonal harmonics in the mid-frequency range.
  # Real diesel car at ~71 dBA: flatness 0.12–0.16, centroid 1441–2023 Hz,
  # lowband 0.14–0.25, midband 0.22–0.35, env_std ~2.0 steady. Diesel engines
  # produce strong tonal harmonics (very low flatness) from the firing cycle.
  # Checked after mower in filter priority. Key separators: from mower — flatness
  # (diesel ≤ 0.20 vs mower ≥ 0.28); from rain — flatness (diesel ≤ 0.20 vs
  # rain ≥ 0.27); from birdsong — lowband (diesel ≥ 0.10 vs birdsong ≤ 0.09);
  # from thunder ambient — tight flatness + env_std limits false positives.
  diesel_centroid_min_hz: 1200        # Real car: 1441+. Separates from very low thunder rumble
  diesel_centroid_max_hz: 3600        # Real car: 1441–2023; headroom for trucks. Below mower range (3808+)
  diesel_flatness_max: 0.20            # Real car: 0.12–0.16. Tonal engine harmonics. Clean gap from mower (≥0.28), rain (≥0.27)
  diesel_lowband_min: 0.10            # Real car: 0.14–0.25. Some bass content. Separates from birdsong (≤0.09)
  diesel_midband_min: 0.20            # Real car: 0.22–0.35. Engine energy sits in mid frequencies
  diesel_env_std_max: 3.0             # Real car: ~2.0 stable. Tight to limit thunder rumble false-positives
  diesel_min_history: 8               # Need 8+ seconds for sustained pattern
  # Flyover targeting: aerial vehicle engine noise (planes, helicopters) and
  # transient vehicle engine sounds that don't match the more specific diesel
  # or mower profiles. Runs late in the filter chain (after mower and diesel)
  # to catch remaining engine-like sounds falling between those specific profiles.
  # Real propeller plane flyover: centroid 2508–10631, flatness 0.22–0.47,
  # lowband 0.16–0.47, midband 0.19–0.42, env_std 0–6.16, bconf 0–0.69.
  # Real vehicle acceleration: centroid 1412–5283, flatness 0.11–0.47,
  # midband 0.33–0.73 (dominant), env_std 0–7.87, bconf 0–0.17.
  # Key separator from music: beat confidence. Engine sounds have low bconf
  # (propeller noise is broadband, changing RPMs destroy periodicity);
  # music has consistent rhythm (bconf > 0.38). Diesel has high bconf from
  # firing cycle, but is caught by its own filter earlier in the chain.
  flyover_flatness_min: 0.15           # Above pure-tone diesel (≤ 0.20), below broadband rain
  flyover_flatness_max: 0.55           # Below rain/mower broadband ceiling
  flyover_centroid_min_hz: 1400       # Real plane 2508+, vehicle accel 2300+; raised from 1400 to exclude storm-rain ambient (1400–1831)
  flyover_centroid_max_hz: 12000      # Doppler-shifted flyovers at distance — real plane up to 10631
  flyover_midband_min: 0.15           # Engine energy indicator — real plane median 0.31
  flyover_lowband_min: 0.10           # Engine rumble — real plane 0.16+; separates from mower (0.02–0.06)
  flyover_lowband_max: 0.50           # Not pure bass thump — real plane max 0.47
  flyover_highband_max: 0.60          # Separates from escaped mower blocks (highband 0.56–0.82)
  flyover_env_std_max: 8.0            # Allows approach/departure amplitude arc — real plane median 2.7
  flyover_min_history: 4              # Short — flyovers are transient (user reports max ~45 seconds)
  flyover_max_beat_confidence: 0.50    # Reject rhythmic sounds (likely music, not engine)
  # Conversation targeting: mid-frequency speech with syllable-level amplitude modulation.
  # Broadest catch — checked last in filter priority order. Not yet battle-tested.
  conversation_centroid_min_hz: 500
  conversation_centroid_max_hz: 2500
  conversation_lowband_max: 0.35      # Not bass-dominant
  conversation_flatness_max: 0.55      # Speech has harmonics (lower than rain/mower)
  conversation_env_std_min: 4.0       # Requires syllable modulation (rejects steady drones)
  conversation_env_std_max: 8.0       # Not wildly erratic (rejects traffic spikes)
  conversation_db_range_max: 15.0     # Max dB range in window — rejects level transitions (mower start/stop)
  conversation_min_history: 10        # 10 seconds for reliable syllable pattern
  conversation_max_music_score: 0.55  # Reject blocks scoring as music — prevents vocal-music false positives
  conversation_min_db: 0.0            # dBA floor (set 60+ to ignore quiet background speech)
  conversation_midband_min: 0.25      # Speech concentrates in the formant/midband region
  # Drive-by auto-dismiss: short events with a fade-out pattern are struck from the record
  driveby_max_duration_sec: 30
  driveby_fade_tail_fraction: 0.5     # Fraction of samples to check for monotonic-ish fade
  allow_response_night: false

response:
  enable_daytime_response: false
  relay_gpio_pin: 18
  relay_active_high: true             # Most opto-isolated relay modules are active-high
  amp_power_on_delay_sec: 1.0         # Seconds to wait after relay on before starting playback
  response_cooldown_sec: 5.0          # Seconds after response stops before resuming detection
  player_command: /usr/bin/cvlc --play-and-exit --no-video
  playlist_dir: /opt/noise-warden/shared/playlist

home_assistant:
  enabled: false
  mode: mqtt  # mqtt | rest_stub
  mqtt_host: 127.0.0.1
  mqtt_port: 1883
  mqtt_topic_prefix: noise_warden
  mqtt_username: ""
  mqtt_password: ""

plugins:
  enable_reference_subtraction: false
  enable_dual_mic_diff: false

# For local development / UI testing on non-Pi hardware where sysfs sensors
# are unavailable. When enabled, these values are used instead of reading
# real hardware. Disable (or remove this section) before deploying to the Pi.
testing_overrides:
  enabled: false
  cpu_temp_c: null                    # Fake SoC temperature in °C (e.g. 72.5)
  cpu_status: null                   # Fake vcgencmd throttle bitmask (e.g. 0 = healthy, 0x50005 = throttled + under-voltage)
