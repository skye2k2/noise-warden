app:
  host: "0.0.0.0"
  port: 8787
  refresh_seconds: 5

storage:
  db_path: "./data/noise_warden.db"
  snippet_dir: "./data/snippets"
  export_dir: "./data/exports"
  max_snippet_seconds: 45
  pre_trigger_seconds: 8

audio:
  sample_rate: 48000
  channels: 1
  frame_ms: 100
  device_index: null
  secondary_device_index: null
  reference_device_index: null
  mic_calibration_offset_db: 0.0
  use_secondary_mic: false
  use_reference_input: false

gpio:
  enabled: false
  relay_pin: 17
  active_high: true

playback:
  enabled: false
  playlist_path: "./media/playlist.m3u"
  vlc_binary: "/usr/bin/cvlc"
  post_playback_suppress_seconds: 12

mode:
  armed: true
  record_only_override: false
  night_record_only: true
  emergency_kill: false

classification:
  zoning: "residential"
  merge_gap_seconds: 10
  min_continuous_seconds: 8
  min_music_band_ratio: 0.28
  min_repetitive_confidence: 0.60
  suppress_driveby_seconds_max: 120
  suppress_weedwhacker_hz_low: 80
  suppress_weedwhacker_hz_high: 350
  suppress_weedwhacker_tonality_ratio: 0.55
  suppress_impulse: true
  suppress_intermittent_vehicle_like: true
  ignore_during_playback: true

ordinance:
  city: "Pleasant Grove, UT"
  day_start: "07:00"
  night_start: "22:00"
  residential:
    continuous_day_dba: 65.0
    continuous_night_dba: 55.0
    intermittent_day_dba: 70.0
    intermittent_night_dba: 60.0
    impulse_day_dba: 75.0
    impulse_night_dba: 60.0

thresholds:
  trigger_margin_db: 1.5
  release_margin_db: 4.0
  release_below_seconds: 12
  hold_min_seconds: 20
  intermittent_window_seconds: 120
  intermittent_on_cycle_threshold: 0.10
  impulse_max_duration_seconds: 2.0

integrations:
  home_assistant:
    enabled: false
    base_url: "http://homeassistant.local:8123"
    token: ""
    ping_timeout_seconds: 2.0
  mqtt:
    enabled: false
    host: "localhost"
    port: 1883
    topic_prefix: "noise_warden"

experimental:
  adaptive_subtraction:
    enabled: false
    learning_rate: 0.01
  dual_mic_rejection:
    enabled: false
    directionality_bias: 0.25
